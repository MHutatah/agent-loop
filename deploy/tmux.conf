# tmux tuned for a phone browser.
#
# The problem: tmux is driven by Ctrl-b, and a phone keyboard has no Ctrl key.
# The fix is to make everything tappable — mouse mode turns the status bar into
# buttons, so switching between the overseer and a running agent is one tap.

set -g mouse on                    # tap a window name to switch; drag to scroll
set -g history-limit 50000         # agents are verbose; keep the scrollback
set -g remain-on-exit on           # a finished agent's output stays readable
set -g base-index 0
setw -g aggressive-resize on       # phone rotate / keyboard open shouldn't corrupt

# Status bar = the navigation. Big, high contrast, current window obvious.
set -g status on
set -g status-position top         # thumb reach, and above the on-screen keyboard
set -g status-interval 5
set -g status-style "bg=#0b1221,fg=#7d8799"
set -g status-left "#[bg=#2563eb,fg=#ffffff,bold] agents #[default] "
set -g status-left-length 20
set -g status-right "#[fg=#7d8799]%H:%M "
set -g status-right-length 20

# Tappable window buttons. The active one is unmistakable on a small screen.
setw -g window-status-format "#[fg=#7d8799] #W "
setw -g window-status-current-format "#[bg=#22c55e,fg=#04140a,bold] #W "
setw -g window-status-separator ""

# Scrolling. `mouse on` makes tmux swallow scroll events, and xterm.js's touch
# support is too weak to hand them over — which is why scrolling appeared to be
# simply missing. These bindings put it back: a scroll gesture on a normal pane
# enters copy-mode and scrolls, instead of being eaten.
setw -g mode-keys vi
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" \
  "send-keys -M" \
  "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -T copy-mode-vi WheelUpPane send -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 3 scroll-down
# Leaving copy-mode should not need a keyboard: tap to scroll back down.
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection

# Escape hatches for when a keyboard IS attached.
set -g prefix C-b
bind -n M-Left previous-window
bind -n M-Right next-window
